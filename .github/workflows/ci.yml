name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint (ruff) and format check (black)
        run: |
          if command -v ruff >/dev/null 2>&1; then ruff check . || true; else echo "ruff not installed"; fi
          if command -v black >/dev/null 2>&1; then black --check . || true; else echo "black not installed"; fi

      - name: Type check (mypy)
        run: |
          if command -v mypy >/dev/null 2>&1; then mypy . || true; else echo "mypy not installed"; fi

      - name: Prepare test DB
        run: |
          # Create sqlite test db file if tests expect it
          touch ./test.db

      - name: Run tests
        run: |
          pytest -q --maxfail=1
        continue-on-error: false

      - name: Upload pytest logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs
          path: ./**/pytest*.log || true
